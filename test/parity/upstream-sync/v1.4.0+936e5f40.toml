[[files]]
path = "packages/durable/src/images/node-worker.ts"
change = "added"
disposition = "ported"
evidence = ["test:durable/images/node/worker_test.go#TestTheWorkersFailuresReachTheirCallerAndTheWorkerGoesOn", "test:durable/images/node/worker_test.go#TestTheWorkerGivesTheSameResultAsTheCallingGoroutine", "test:durable/images/node/worker_test.go#TestTheWorkerKeepsTheCallersBytes"]
rationale = "New in Pi 1.2.0: the worker thread of createNodePhotonImages, which prepares each request with Photon and posts back its result or its error message by request ID. durable/images/node/node.go ports it as the worker goroutine (workerImages.run and prepare): a job carries the bytes, MIME type, limits and a reply channel, and the reply carries the result, the error, or a panic, which the caller raises again. Request IDs, postMessage and the transfer of the buffer have no Go form, because the reply channel belongs to its one request. The tests assert that a failure reaches its caller and the worker goes on, the same result as on the calling goroutine, and the caller's bytes kept."

[[files]]
path = "packages/durable/src/images/node.ts"
change = "added"
disposition = "ported"
evidence = ["test:durable/images/node/node_test.go#TestTheNodeAndCloudflareProcessorsPrepareA1x1GIF", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesOneImageAtATime", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesImagesInCallOrder", "test:durable/images/node/worker_test.go#TestWorkerFalsePreparesWithThePlainProcessor", "test:durable/images/node/worker_test.go#TestTheWorkerPreparesOnItsOwnGoroutine", "test:durable/images/node/worker_test.go#TestTheWorkerExitsWhenIdleAndTheNextImageStartsAnother", "test:durable/images/node/worker_test.go#TestTheWorkerHonoursACancelledContext"]
rationale = "New in Pi 1.2.0: createNodePhotonImages({ worker, idleMs }), Photon in a worker thread by default, which exits after idleMs (30 s) without requests and is started again by the next image; worker: false prepares on the calling thread, one image at a time in call order. durable/images/node/node.go ports CreateNodePhotonImages and NodePhotonImagesOptions with one worker goroutine, the idle exit and the restart; with Worker false it returns images.CreatePhotonImages, which prepares on the caller's goroutine one call at a time in call order (index.ts row). Designed out: reading Photon's WebAssembly from the installed package, ref/unref of the worker, and the fallback to the calling thread when a worker cannot start. The Go processor (durable/images) is native, has no module to read, and a goroutine always starts. The tests assert the worker's one image at a time in call order on its own goroutine, worker false as the plain processor, the idle exit and restart, and cancellation."

