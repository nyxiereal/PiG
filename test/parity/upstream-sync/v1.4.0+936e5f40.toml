[[files]]
path = "packages/ai/src/telemetry.ts"
change = "added"
disposition = "ported"
evidence = ["test:ai/telemetry_upstream_test.go#TestAITelemetryObservesWithoutChangingDeliveredEventsOrResultsUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryReportsErrorAndAbortedStatusUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryBoundsPollErrorMessagesUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryIncludesSetupFailuresAndOmitsNonScalarReasoningUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryCountsInterleavedToolDeltasIndependentlyUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetrySupportsTracingOnlySpanUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryDefaultsToNoopUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryRecordsLowCardinalityMetricsWithMonotonicDurationsUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryRecordsUsageForPollOnlyWhenFinalUpstream", "test:ai/telemetry_upstream_test.go#TestAITelemetryCreatesInstrumentsOncePerMetricsObjectUpstream"]
rationale = "Pi 2ec55d80 adds the pi.ai.request and pi.ai.poll span schema and observeModelRequest. ai/telemetry.go ports both (AITelemetrySchema, the span, events first_chunk and one block per completed block, end attributes, provider_error status with the message cut to 500 UTF-16 units, the four metrics read from the parent's Metrics()), with attributes in Pi's key order everywhere. A nil or no-op parent installs no observer, so the no-telemetry path allocates nothing extra (BenchmarkModelsStreamNoTelemetry: 132 allocs/op, the same as before the port). Gaps recorded in the code: the instrument cache holds a strong reference per metrics adapter where Pi uses a WeakMap, and response.id is omitted when empty because Go cannot tell Pi's empty string from undefined. Mutants: removing the observer from Models.Stream fails TestAITelemetryObservesWithoutChangingDeliveredEventsOrResultsUpstream."

