[[files]]
path = "packages/telemetry/src/index.ts"
change = "added"
disposition = "ported"
evidence = ["test:telemetry/telemetry_upstream_test.go#TestTelemetryUpstream", "test:telemetry/store_upstream_test.go#TestInMemoryTelemetryStoreConformance"]
rationale = "Pi 2ec55d80 and d9025a5f split the telemetry barrel and add the store, trace and metric row types, TraceQuery, MetricQuery and TelemetryStore, and give TelemetryContext optional Metrics() and Propagation() accessors. telemetry/context.go and telemetry/store.go port them (nil means absent; the store calls block and return (value, error)); the exported API adds telemetry.TelemetryStore, StoredSpan, StoredTrace, StoredMetric, TraceQuery, MetricQuery and RenderTrace."

[[files]]
path = "packages/telemetry/src/memory.ts"
change = "added"
disposition = "ported"
evidence = ["test:telemetry/store_upstream_test.go#TestInMemoryTelemetryStoreConformance", "test:telemetry/store_upstream_test.go#TestInMemoryStoreSnapshots", "test:telemetry/attributes_test.go#TestInMemoryRecorderKeepsAttributeInsertionOrder", "test:telemetry/propagation_upstream_test.go#TestPropagationUpstream"]
rationale = "Pi d9025a5f turns the recorder into a TelemetryStore: it filters by first-span name, any error, one-span attribute equality and start window with cursor paging, offers GetTrace and FindMetrics, adds a pi-memory-trace carrier key (Extract needs all three keys with opaque identifiers), returns an inert span that keeps the recorder's capabilities when a span starts after its parent settled, and no longer validates or suppresses malformed input. telemetry/memory.go ports it. Go maps have no insertion order, so SpanAttributes keeps ordered attributes and every row is written in Pi's key order (TestInMemoryRecorderKeepsAttributeInsertionOrder)."

